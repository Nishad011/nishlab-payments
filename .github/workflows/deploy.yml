name: Deploy payments site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject payment links from repository secrets
        env:
          PAY_SW_FULL: ${{ secrets.PAY_SW_FULL }}
          PAY_SW_PART1: ${{ secrets.PAY_SW_PART1 }}
          PAY_SW_BALANCE: ${{ secrets.PAY_SW_BALANCE }}
          PAY_AC_FULL: ${{ secrets.PAY_AC_FULL }}
          PAY_ACSW_FULL: ${{ secrets.PAY_ACSW_FULL }}
          PAY_SWAN_FULL: ${{ secrets.PAY_SWAN_FULL }}
        run: |
          mkdir dist
          cp index.html CNAME dist/
          python3 - <<'PY'
          import os, sys
          path = "dist/index.html"
          html = open(path, encoding="utf-8").read()
          keys = ["PAY_SW_FULL", "PAY_SW_PART1", "PAY_SW_BALANCE",
                  "PAY_AC_FULL", "PAY_ACSW_FULL", "PAY_SWAN_FULL"]
          for k in keys:
              v = os.environ.get(k, "").strip()
              if not v.startswith("https://payments.cashfree.com/"):
                  sys.exit("Secret " + k + " is missing or is not a Cashfree link")
              html = html.replace("__" + k + "__", v)
          if "__PAY_" in html:
              sys.exit("A payment placeholder was left in index.html")
          open(path, "w", encoding="utf-8").write(html)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
